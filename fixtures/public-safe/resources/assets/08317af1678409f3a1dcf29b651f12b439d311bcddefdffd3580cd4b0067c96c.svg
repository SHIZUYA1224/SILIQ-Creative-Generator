<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <title>Phase 0 fixture logo (synthetic, outlined shapes only)</title>
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F6FEB"/>
      <stop offset="1" stop-color="#0B3D91"/>
    </linearGradient>
  </defs>
  <!-- Mark: rounded square with an even-odd cut-out and a curved swoosh -->
  <g transform="translate(10 10)">
    <path fill="url(#mark)" fill-rule="evenodd"
          d="M16 0 H64 Q80 0 80 16 V64 Q80 80 64 80 H16 Q0 80 0 64 V16 Q0 0 16 0 Z
             M40 18 C52 18 62 28 62 40 C62 52 52 62 40 62 C28 62 18 52 18 40 C18 28 28 18 40 18 Z"/>
    <circle cx="40" cy="40" r="10" fill="#F5C83C"/>
  </g>
  <!-- Word-mark substitute: outlined bars (no SVG text) -->
  <g fill="#171717">
    <rect x="105" y="22" width="180" height="14" rx="7"/>
    <rect x="105" y="44" width="130" height="14" rx="7" fill-opacity="0.7"/>
    <polygon points="105,66 245,66 238,78 105,78"/>
    <ellipse cx="270" cy="72" rx="12" ry="6" transform="rotate(-15 270 72)"/>
  </g>
</svg>
